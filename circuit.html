<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course RC</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07060d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; overflow: hidden; }
    #scene { position: fixed; inset: 0; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #07060d; font-size: 15px; z-index: 9; transition: opacity .5s; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .box { background: rgba(14, 11, 26, .78); border: 1px solid #ffffff1f; border-radius: 12px; backdrop-filter: blur(4px); }
    #dash { position: fixed; top: 16px; left: 16px; padding: 12px 16px; display: grid; grid-template-columns: auto auto; gap: 2px 16px; align-items: baseline; font-size: 13px; z-index: 3; }
    #dash .big { grid-column: span 2; font-size: 38px; font-weight: 800; line-height: 1; color: #00e5ff; }
    #dash .big small { font-size: 14px; color: #a39dbd; font-weight: 600; }
    #dash span.l { color: #a39dbd; }
    #dash b { font-variant-numeric: tabular-nums; }
    #minimap { position: fixed; top: 16px; right: 16px; width: 130px; height: 130px; border-radius: 12px; z-index: 3; }
    #help { position: fixed; left: 16px; bottom: 16px; padding: 10px 14px; font-size: 12px; line-height: 1.7; z-index: 3; }
    #help kbd { background: #fff2; border-radius: 4px; padding: 0 5px; font-family: inherit; }
    #back { position: fixed; right: 16px; top: 156px; z-index: 3; background: #7b2cbf; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    #msg { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); font-size: 34px; font-weight: 800; text-shadow: 0 0 18px #ff2bd6, 0 0 4px #000; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 4; text-align: center; width: max-content; max-width: calc(100% - 32px); }
    #msg.show { opacity: 1; transform: translate(-50%, 0); }
    /* Volant et pédales */
    #controls { position: fixed; inset: auto 0 16px 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 16px; pointer-events: none; z-index: 5; }
    #controls > * { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #wheel { width: 160px; height: 160px; cursor: grab; }
    #wheel svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 10px #0009); }
    .pedals { display: flex; align-items: flex-end; gap: 12px; }
    .pedal { width: 66px; border-radius: 12px 12px 18px 18px; border: 2px solid #ffffff40; display: grid; place-items: end center; padding-bottom: 10px; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #fff;
      background: repeating-linear-gradient(0deg, #ffffff14 0 6px, transparent 6px 12px), linear-gradient(#3a3550, #1b1830); box-shadow: 0 6px 0 #0d0b18, 0 8px 18px #0008;
      transform-origin: 50% 100%; transition: transform .08s, box-shadow .08s; cursor: pointer; }
    #pedal-brake { height: 100px; }
    #pedal-gas { height: 135px; width: 58px; }
    #pedal-brake.down { transform: perspective(300px) rotateX(18deg); box-shadow: 0 2px 0 #0d0b18, 0 0 18px #ff2b4a; border-color: #ff2b4a; }
    #pedal-gas.down { transform: perspective(300px) rotateX(18deg); box-shadow: 0 2px 0 #0d0b18, 0 0 18px #00e5ff; border-color: #00e5ff; }
    #btn-reset { position: fixed; right: 158px; top: 16px; z-index: 5; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ffffff40; background: rgba(14, 11, 26, .78); color: #fff; font-size: 20px; cursor: pointer; }
    /* Feux de départ */
    #lights { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); display: none; gap: 10px; padding: 10px 14px; z-index: 4; }
    #lights.show { display: flex; }
    #lights i { width: 26px; height: 26px; border-radius: 50%; background: #2a1520; border: 2px solid #000; }
    #lights i.on { background: #ff1a2e; box-shadow: 0 0 16px #ff1a2e; }
    #lights i.go { background: #1aff6a; box-shadow: 0 0 16px #1aff6a; }
    /* Résultats */
    #result { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.95); width: min(340px, calc(100% - 32px)); padding: 20px; z-index: 8; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
    #result.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
    #result h2 { margin: 0 0 12px; font-size: 22px; }
    #result ol { list-style: none; margin: 0 0 12px; padding: 0; font-size: 15px; }
    #result li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
    #result li.me { background: #ffffff1a; font-weight: 700; }
    #result li b { margin-left: auto; font-variant-numeric: tabular-nums; }
    #result .dot { width: 12px; height: 12px; border-radius: 50%; }
    #result p { margin: 0 0 14px; font-size: 13px; color: #a39dbd; }
    #result .row { display: flex; gap: 10px; }
    #result button, #result a { flex: 1; text-align: center; padding: 10px; border-radius: 10px; border: 0; font: inherit; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer; }
    #result button { background: #00e5ff; color: #07060d; }
    #result a { background: #7b2cbf; color: #fff; }
    #help { left: 50%; transform: translateX(-50%); text-align: center; }
    @media (max-width: 1150px) { #help { display: none; } }
    @media (max-width: 520px) { #btn-reset { right: 128px; } #wheel { width: 138px; height: 138px; } .pedal { width: 58px; } #pedal-gas { width: 52px; height: 120px; } #pedal-brake { height: 88px; } }
    @media (max-width: 520px) { #dash .big { font-size: 30px; } #minimap { width: 100px; height: 100px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="loader">Préparation de la course…</div>
  <div id="dash" class="box">
    <div class="big"><span id="speed">0</span> <small>km/h</small></div>
    <span class="l">Position</span><b id="place">-/4</b>
    <span class="l">Tour</span><b id="lap">1/3</b>
    <span class="l">Temps</span><b id="lap-time">--:--.--</b>
    <span class="l">Record tour</span><b id="best">--:--.--</b>
  </div>
  <canvas id="minimap" class="box"></canvas>
  <div id="msg"></div>
  <div id="help" class="box">
    Volant et pédales à la souris, ou <kbd>Z</kbd>/<kbd>↑</kbd> accélérer · <kbd>S</kbd>/<kbd>↓</kbd> freiner · <kbd>Q</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> tourner<br>
    <kbd>Espace</kbd> frein à main · <kbd>R</kbd> remettre sur la piste · <kbd>C</kbd> caméra · <kbd>Échap</kbd> retour
  </div>
  <a id="back" href="index.html">← Retour à la chambre</a>
  <div id="lights" class="box"><i></i><i></i><i></i><i></i><i></i></div>
  <button id="btn-reset" title="Remettre sur la piste">↺</button>
  <div id="controls">
    <div id="wheel" aria-label="Volant">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#14121e" stroke-width="12"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="#3a3550" stroke-width="7"/>
        <path d="M14 50 Q50 62 86 50" fill="none" stroke="#2a2640" stroke-width="9" stroke-linecap="round"/>
        <path d="M50 58 L50 91" stroke="#2a2640" stroke-width="9" stroke-linecap="round"/>
        <circle cx="50" cy="54" r="13" fill="#1b1830" stroke="#00e5ff" stroke-width="2"/>
        <path d="M44 51 l6 -5 l6 5 l-6 9 z" fill="#ff1a1a"/>
        <rect x="47" y="5" width="6" height="10" rx="2" fill="#ff2bd6"/>
      </svg>
    </div>
    <div class="pedals">
      <div id="pedal-brake" class="pedal">FREIN</div>
      <div id="pedal-gas" class="pedal">GAZ</div>
    </div>
  </div>
  <div id="result" class="box">
    <h2></h2>
    <ol></ol>
    <p></p>
    <div class="row"><button id="btn-again">Rejouer</button><a href="index.html">Chambre</a></div>
  </div>
  <script type="module" src="./circuit.js"></script>
</body>
</html>
